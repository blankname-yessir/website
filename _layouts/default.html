<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
<style>
  :root { --bg: #faf9f6; --text: #111; --muted: #6b6b6b; --rule: #e6e3dc; }
  * { box-sizing: border-box; }
  body { max-width: 36rem; margin: 0; padding: 2.5rem 1.5rem 4rem 2rem; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  a { color: var(--text); }
  a:hover { color: var(--muted); }
  h1 { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin: 0; }
  h2 { font-size: 1rem; font-weight: 600; margin: 2.5rem 0 0.5rem; }
  .tagline { margin: 0 0 1.25rem; color: var(--muted); font-size: 1rem; }
  .blurb { margin: 0.25rem 0 0; color: #333; }
  .blurb + .blurb { margin-top: 1rem; }
  .post p, .post li { color: #333; }
  .empty { color: var(--muted); font-size: 0.9rem; }
  .posts { list-style: none; padding: 0; margin: 0; }
  .posts li { display: flex; gap: 1rem; padding: 0.3rem 0; }
  .posts time { color: var(--muted); font-size: 0.85rem; flex: 0 0 6.5rem; padding-top: 0.1rem; }
  .posts a { text-decoration: none; }
  .posts a:hover { text-decoration: underline; }
  .post h1 { font-size: 1.15rem; margin-bottom: 0.25rem; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 2rem; }
  .post img { max-width: 100%; }
  .post pre { overflow-x: auto; background: #f0eee8; padding: 1rem; font-size: 0.85rem; }
  .post blockquote { margin: 1.5rem 0; padding-left: 1rem; border-left: 2px solid var(--rule); color: #444; }
  nav.home { margin-bottom: 2.5rem; font-size: 0.9rem; }
  nav.home a { text-decoration: none; color: var(--muted); }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
{% if page.layout == "post" %}<nav class="home"><a href="{{ '/' | relative_url }}">← {{ site.title }}</a></nav>{% endif %}
<main>
{{ content }}
</main>
<footer>© {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
