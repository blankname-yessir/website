<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="alternate" type="application/rss+xml" href="{{ '/feed.xml' | relative_url }}">
<style>
  body { max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; font: 18px/1.6 Georgia, "Times New Roman", serif; color: #222; background: #fff; }
  a { color: #0645ad; }
  header a { color: inherit; text-decoration: none; font-weight: bold; }
  h1 { font-size: 1.8rem; line-height: 1.2; }
  .posts { list-style: none; padding: 0; }
  .posts li { margin: 0.6rem 0; }
  .posts time { color: #777; font-size: 0.9rem; margin-right: 0.75rem; }
  .meta { color: #777; font-size: 0.9rem; }
  img { max-width: 100%; }
  pre { overflow-x: auto; background: #f6f6f6; padding: 1rem; }
  footer { margin-top: 4rem; color: #777; font-size: 0.85rem; }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
<main>
{{ content }}
</main>
<footer>© {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
